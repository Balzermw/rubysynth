[package]
name = "rubysynth"
version = "0.1.0"
edition = "2021"
description = "Offline soft-synth based on the Rubysynth design spec, with a skinned browser editor and a click-to-play keyboard."
license = "MIT"
repository = "https://github.com/Balzermw/rubysynth"

[lib]
path = "src/lib.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[[bin]]
name = "webui"
path = "src/bin/webui.rs"

[dependencies]
hound = "3.5"
midly = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
mime = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
